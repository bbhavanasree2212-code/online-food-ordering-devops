apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-food-ordering
  labels:
    app: online-food-ordering
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-food-ordering
  template:
    metadata:
      labels:
        app: online-food-ordering
    spec:
      containers:
        - name: online-food-ordering
          image: bbhavanasree/online-food-ordering:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: online-food-ordering-service
spec:
  type: NodePort
  selector:
    app: online-food-ordering
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084
